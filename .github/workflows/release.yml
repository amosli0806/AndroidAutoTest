# 发版工作流：推 v* tag 自动打包并创建 GitHub Release。
#
# 流程（与 README「检查更新与发版」一致）：
#   校验 tag 与 utils/version.py 的 APP_VERSION 一致
#   -> 打包主程序（main.spec）与独立更新器（updater.spec）
#   -> 跑更新器自测 + 更新链路自测（任一失败即中止，不会产出坏 Release）
#   -> 校验产物完整性 -> 压 zip（不含 data/ 等运行期数据）
#   -> 生成增量补丁（对比上一个 Release 的全量包，失败只跳过、不阻塞发版）
#   -> 创建 Release 并上传
#
# Release 资产名固定带 -win64.zip 后缀（services/update_service.py 的
# UPDATE_ASSET_SUFFIX 按它挑包）。Release 说明先给占位，发完后在网页上编辑，
# 应用内「检查更新」显示的就是这段文字。
#
# ⚠️ 增量补丁资产的命名红线：必须形如 patch-<from>-to-<to>.dpatch，**绝不能**带
#    .zip / -win64.zip / chongshi- 前缀。老版本客户端的 _pick_asset 只挑 .zip 且优先
#    认「chongshi- + -win64.zip」，一旦补丁长得像全量包，**旧客户端会把补丁当全量包
#    下载**，解压后缺 虫师.exe/_internal，更新直接失败。现在这个名字对老客户端完全不可见。
#    同理：**每次发版都必须照常产出全量 zip**，绝不做「只发补丁」的 Release。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# CI 机器默认代码页不是 UTF-8：python 步骤里 print 中文会抛 UnicodeEncodeError
# （v1.1.3 第一次 CI 失败就是因为校验成功后的中文 print 崩了）；PyInstaller 处理
# 「虫师.exe」这类中文路径同样需要 UTF-8 模式 —— 所以全局强制。
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  # 固定时间戳 -> PyInstaller 产出的 .pyc/zip 内嵌时间稳定，跨版本对比时
  # 「没变的文件」才能稳定命中，增量补丁更小。只影响内嵌时间，不影响功能。
  SOURCE_DATE_EPOCH: '1704067200'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要历史 tag 才能用 git describe 找到「上一个版本」，默认 depth=1 不够
          fetch-depth: 0

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 环境探针（确认 python 可用）
        shell: python
        run: import sys; print("python ok:", sys.version)

      - name: 校验 tag 与代码版本一致
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#V}"
          VER="$(grep -oE 'APP_VERSION[[:space:]]*=[[:space:]]*"[^"]+"' utils/version.py \
                 | grep -oE '"[^"]+"' | tr -d '"' | head -1)"
          if [ -z "$VER" ]; then
            echo "::error::utils/version.py 里找不到 APP_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag 是 $TAG，但 utils/version.py 的 APP_VERSION=$VER，两者必须一致"
            exit 1
          fi
          echo "版本一致：$VER（tag=$GITHUB_REF_NAME）"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包 weditor 独立服务（weditor.spec，应用可视化依赖）
        run: pyinstaller weditor.spec --noconfirm --distpath dist_weditor --workpath build_weditor

      - name: 打包主程序（main.spec）
        run: pyinstaller main.spec --noconfirm

      - name: 打包独立更新器（updater.spec）
        run: pyinstaller updater.spec --noconfirm --distpath dist_updater --workpath build_updater

      - name: 更新器自测（替换 / 回滚 / 坏包 / 临时锁）
        run: python updater_selftest.py

      - name: 更新链路自测（下载 -> 校验 -> 解压 -> 交更新器）
        run: python update_pipeline_selftest.py

      - name: 校验产物完整性
        shell: python
        run: |
          import os, sys
          missing = [p for p in (
              os.path.join("dist", "虫师", "虫师.exe"),
              os.path.join("dist", "虫师", "_internal"),
              os.path.join("dist", "虫师", "_internal", "tools", "weditor.exe"),
              os.path.join("dist_updater", "updater.exe"),
          ) if not os.path.exists(p)]
          if missing:
              sys.exit("产物缺失：" + "、".join(missing))
          print("artifacts ok: exe / _internal / tools+ / weditor.exe / updater.exe present")

      - name: 压更新包（不含 data/ 等运行期数据）
        shell: python
        run: |
          import os, zipfile, sys
          ver = "${{ github.ref_name }}".lstrip("v")
          # 包名用纯 ASCII：GitHub 对中文文件名会丢前缀（v1.1.3 变成了 -1.1.3-win64.zip），
          # 应用内 update_service 只认 -win64.zip 后缀，换英文名不影响匹配。
          out = f"chongshi-{ver}-win64.zip"
          base = os.path.join("dist", "虫师")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for root, dirs, files in os.walk(base):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, base))
              z.write(os.path.join("dist_updater", "updater.exe"), "updater.exe")
          with zipfile.ZipFile(out) as z:
              names = z.namelist()
              leaked = [n for n in names
                        if n == "data" or n.startswith("data/")
                        or n.endswith(".log")]
              if leaked:
                  sys.exit(f"更新包里混入了运行期数据：{leaked[:5]}")
              need = ("虫师.exe", "_internal", "updater.exe")
              for n in need:
                  if not any(x == n or x.startswith(n + "/") for x in names):
                      sys.exit(f"更新包里缺少 {n}")
          size_mb = os.path.getsize(out) / 1024 / 1024
          print(f"packed {out} ({size_mb:.1f} MB, {len(names)} files, no data/ leak)")

      - name: 生成增量补丁（对比上一个 Release；失败只跳过，不阻塞发版）
        id: mkpatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          VER="${GITHUB_REF_NAME#v}"; VER="${VER#V}"
          # 上一个 tag（本 tag 的父提交上最近的 tag）。拿不到就直接跳过。
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "没有上一个 tag，跳过增量补丁"
            echo "made=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PREV="${PREV_TAG#v}"; PREV="${PREV#V}"
          rm -rf prev_dl prev_tree; mkdir -p prev_dl prev_tree
          # 下载到独立目录，避免和本次刚压出来的 chongshi-*-win64.zip 混在一起
          if ! gh release download "$PREV_TAG" --pattern 'chongshi-*-win64.zip' --dir prev_dl --clobber; then
            echo "拿不到上一个 Release 的全量包，跳过增量补丁"
            echo "made=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PREV_ZIP="$(ls prev_dl/chongshi-*-win64.zip 2>/dev/null | head -1 || true)"
          if [ -z "$PREV_ZIP" ]; then
            echo "上一个 Release 里没有全量包，跳过增量补丁"
            echo "made=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$PREV_ZIP" prev_tree
          PATCH_OUT="patch-${PREV}-to-${VER}.dpatch"
          if ! python make_update_patch.py \
                 --old-tree prev_tree --new-tree "dist/虫师" \
                 --extra "updater.exe=dist_updater/updater.exe" \
                 --exclude "_internal/tools/weditor.exe" \
                 --exclude "updater.exe" \
                 --from "$PREV" --to "$VER" --out "$PATCH_OUT"; then
            echo "补丁没生成（拿不到上一个包 / 补丁不够小），跳过 —— 不影响全量发版"
            echo "made=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "made=true" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH_OUT" >> "$GITHUB_OUTPUT"

      - name: 校验全量包已产出（每次发版都必须有全量包）
        shell: python
        run: |
          import glob, sys
          zips = glob.glob("chongshi-*-win64.zip")
          if not zips:
              sys.exit("没有找到全量更新包 chongshi-*-win64.zip —— 绝不允许只发补丁")
          print("全量包：", zips)

      - name: 提取当前版本的更新说明
        shell: python
        run: |
          import re, sys
          ver = "${{ github.ref_name }}".lstrip("vV")
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except OSError:
              text = ""
          # 找 "## vX.Y.Z" 这个标题，取它到下一个 "## " 之间的正文
          m = re.search(rf'(?m)^##\s+v?{re.escape(ver)}\s*\n(.*?)(?=^##\s+|\Z)',
                        text, re.DOTALL)
          body = m.group(1).strip() if m else ""
          if body:
              open("release_notes.md", "w", encoding="utf-8").write(body)
              print(f"已提取 v{ver} 的更新说明（{len(body)} 字符）")
          else:
              open("release_notes.md", "w", encoding="utf-8").write(
                  f"自动构建的发布版本 ${{ github.ref_name }}。")
              print(f"CHANGELOG.md 里没找到 v{ver} 段落，使用占位说明")

      - name: 创建 Release 并上传更新包（含增量补丁）
        uses: softprops/action-gh-release@v2
        with:
          name: 虫师 ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            chongshi-*-win64.zip
            patch-*-to-*.dpatch
          # 补丁是可选的（首个版本 / 拿不到上一个包时没有），所以不因它未命中而失败；
          # 「全量包必须存在」由上面那步显式断言，保证不会出现只发补丁的 Release。
          fail_on_unmatched_files: false
