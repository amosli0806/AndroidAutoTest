# 发版工作流：推 v* tag 自动打包并创建 GitHub Release。
#
# 流程（与 README「检查更新与发版」一致）：
#   校验 tag 与 utils/version.py 的 APP_VERSION 一致
#   -> 打包主程序（main.spec）与独立更新器（updater.spec）
#   -> 跑更新器自测 + 更新链路自测（任一失败即中止，不会产出坏 Release）
#   -> 校验产物完整性 -> 压 zip（不含 data/ 等运行期数据）-> 创建 Release 并上传
#
# Release 资产名固定带 -win64.zip 后缀（services/update_service.py 的
# UPDATE_ASSET_SUFFIX 按它挑包）。Release 说明先给占位，发完后在网页上编辑，
# 应用内「检查更新」显示的就是这段文字。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# CI 机器默认代码页不是 UTF-8：python 步骤里 print 中文会抛 UnicodeEncodeError
# （v1.1.3 第一次 CI 失败就是因为校验成功后的中文 print 崩了）；PyInstaller 处理
# 「虫师.exe」这类中文路径同样需要 UTF-8 模式 —— 所以全局强制。
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 环境探针（确认 python 可用）
        shell: python
        run: import sys; print("python ok:", sys.version)

      - name: 校验 tag 与代码版本一致
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#V}"
          VER="$(grep -oE 'APP_VERSION[[:space:]]*=[[:space:]]*"[^"]+"' utils/version.py \
                 | grep -oE '"[^"]+"' | tr -d '"' | head -1)"
          if [ -z "$VER" ]; then
            echo "::error::utils/version.py 里找不到 APP_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag 是 $TAG，但 utils/version.py 的 APP_VERSION=$VER，两者必须一致"
            exit 1
          fi
          echo "版本一致：$VER（tag=$GITHUB_REF_NAME）"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包 weditor 独立服务（weditor.spec，应用可视化依赖）
        run: pyinstaller weditor.spec --noconfirm --distpath dist_weditor --workpath build_weditor

      - name: 打包主程序（main.spec）
        run: pyinstaller main.spec --noconfirm

      - name: 打包独立更新器（updater.spec）
        run: pyinstaller updater.spec --noconfirm --distpath dist_updater --workpath build_updater

      - name: 更新器自测（替换 / 回滚 / 坏包 / 临时锁）
        run: python updater_selftest.py

      - name: 更新链路自测（下载 -> 校验 -> 解压 -> 交更新器）
        run: python update_pipeline_selftest.py

      - name: 校验产物完整性
        shell: python
        run: |
          import os, sys
          missing = [p for p in (
              os.path.join("dist", "虫师", "虫师.exe"),
              os.path.join("dist", "虫师", "_internal"),
              os.path.join("dist", "虫师", "_internal", "tools", "weditor.exe"),
              os.path.join("dist_updater", "updater.exe"),
          ) if not os.path.exists(p)]
          if missing:
              sys.exit("产物缺失：" + "、".join(missing))
          print("artifacts ok: exe / _internal / tools+ / weditor.exe / updater.exe present")

      - name: 压更新包（不含 data/ 等运行期数据）
        shell: python
        run: |
          import os, zipfile, sys
          ver = "${{ github.ref_name }}".lstrip("v")
          # 包名用纯 ASCII：GitHub 对中文文件名会丢前缀（v1.1.3 变成了 -1.1.3-win64.zip），
          # 应用内 update_service 只认 -win64.zip 后缀，换英文名不影响匹配。
          out = f"chongshi-{ver}-win64.zip"
          base = os.path.join("dist", "虫师")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for root, dirs, files in os.walk(base):
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, base))
              z.write(os.path.join("dist_updater", "updater.exe"), "updater.exe")
          with zipfile.ZipFile(out) as z:
              names = z.namelist()
              leaked = [n for n in names
                        if n == "data" or n.startswith("data/")
                        or n.endswith(".log")]
              if leaked:
                  sys.exit(f"更新包里混入了运行期数据：{leaked[:5]}")
              need = ("虫师.exe", "_internal", "updater.exe")
              for n in need:
                  if not any(x == n or x.startswith(n + "/") for x in names):
                      sys.exit(f"更新包里缺少 {n}")
          size_mb = os.path.getsize(out) / 1024 / 1024
          print(f"packed {out} ({size_mb:.1f} MB, {len(names)} files, no data/ leak)")

      - name: 提取当前版本的更新说明
        shell: python
        run: |
          import re, sys
          ver = "${{ github.ref_name }}".lstrip("vV")
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except OSError:
              text = ""
          # 找 "## vX.Y.Z" 这个标题，取它到下一个 "## " 之间的正文
          m = re.search(rf'(?m)^##\s+v?{re.escape(ver)}\s*\n(.*?)(?=^##\s+|\Z)',
                        text, re.DOTALL)
          body = m.group(1).strip() if m else ""
          if body:
              open("release_notes.md", "w", encoding="utf-8").write(body)
              print(f"已提取 v{ver} 的更新说明（{len(body)} 字符）")
          else:
              open("release_notes.md", "w", encoding="utf-8").write(
                  f"自动构建的发布版本 ${{ github.ref_name }}。")
              print(f"CHANGELOG.md 里没找到 v{ver} 段落，使用占位说明")

      - name: 创建 Release 并上传更新包
        uses: softprops/action-gh-release@v2
        with:
          name: 虫师 ${{ github.ref_name }}
          body_path: release_notes.md
          files: chongshi-*-win64.zip
          fail_on_unmatched_files: true
